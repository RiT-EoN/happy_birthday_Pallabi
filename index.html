<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A little surprise for you !!</title>
  <meta name="theme-color" content="#120a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="A little surprise for you !!">
  <meta property="og:description" content="Tap to open. Turn your sound on and get ready to blow!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Comic+Neue:wght@700&family=Great+Vibes&family=Lora:ital,wght@0,500;1,500&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg: #555675;
    --wax: #FCE4EC;
    --outline: #000;
    --shadow: #3B3A55;
    --flame-out: #FA8C00;
    --flame-in: #FFD400;
    --k: 1;
    --font: "Comic Neue", "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive;
  }

  * {
    box-sizing: border-box
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: var(--font);
    font-weight: 700
  }

  .screen {
    display: none;
    min-height: 100svh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px))
  }

  .screen.active {
    display: flex;
    animation: fade .5s ease
  }

  @keyframes fade {
    from {
      opacity: 0
    }
  }

  h1 {
    font-size: clamp(2rem, 8vw, 3rem);
    margin: 0 0 1.2rem;
    line-height: 1.15
  }

  .prompt {
    font-size: clamp(1.8rem, 7.5vw, 2.6rem);
    margin: 0;
    letter-spacing: .02em
  }

  .hint {
    min-height: 1.5em;
    margin: 1.2rem 0 0;
    font-size: 1rem;
    opacity: .85
  }

  .btn {
    font: inherit;
    font-size: 1.5rem;
    background: var(--flame-in);
    color: #000;
    border: 4px solid var(--outline);
    border-radius: 16px;
    padding: .5em 1.8em;
    box-shadow: 6px 6px 0 var(--outline);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s
  }

  .btn:active {
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0 var(--outline)
  }

  .btn:focus-visible {
    outline: 4px solid #fff;
    outline-offset: 4px
  }

  /* ---------- countdown ---------- */
  #blow {
    justify-content: flex-start;
    padding-top: calc(9vh + env(safe-area-inset-top, 0px))
  }

  .count {
    font-size: clamp(4.5rem, 22vw, 7rem);
    line-height: 1;
    min-height: 1.1em;
    margin-top: .15em
  }

  .count.pop {
    animation: pop .45s ease
  }

  @keyframes pop {
    from {
      transform: scale(1.5);
      opacity: 0
    }
  }

  /* ---------- candle (cel-shaded anime/cartoon) ---------- */
  .scene {
    transform: scale(var(--k));
    transform-origin: top center;
    padding-top: 250px;
    margin-top: .2rem;
    position: relative
  }

  .candle {
    position: relative;
    width: 120px;
    height: 300px;
    animation: rise .9s cubic-bezier(.2, .9, .3, 1.25) both
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(60px)
    }
  }

  .body {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    border: 4px solid var(--outline);
    border-radius: 0 0 12px 12px;
    background: linear-gradient(90deg, #FFF4F8 0 16%, var(--wax) 16% 64%, #F6C6D8 64% 100%)
  }

  .body::after {
    content: "";
    position: absolute;
    left: 8px;
    top: 44px;
    bottom: 26px;
    width: 6px;
    border-radius: 6px;
    background: #fff;
    opacity: .9
  }

  .pool {
    position: absolute;
    z-index: 2;
    left: -4px;
    right: -4px;
    top: -17px;
    height: 34px;
    border: 4px solid var(--outline);
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 55%, #F7AFC6 0 26%, #FFF4F8 28%)
  }

  .drip {
    position: absolute;
    left: calc(100% - 2px);
    top: 110px;
    width: 26px;
    height: 54px;
    background: var(--wax);
    border: 4px solid var(--outline);
    border-left: 0;
    border-radius: 0 14px 24px 0
  }

  .drip.d2 {
    left: 20px;
    top: 8px;
    width: 24px;
    height: 80px;
    border: 4px solid var(--outline);
    border-top: 0;
    border-radius: 0 0 14px 14px;
    background: linear-gradient(90deg, #FFF4F8 0 30%, var(--wax) 30%)
  }

  .wick {
    position: absolute;
    z-index: 3;
    left: calc(50% - 3px);
    bottom: calc(100% - 2px);
    width: 6px;
    height: 30px;
    background: linear-gradient(#2a2a2a, #000);
    border-radius: 3px 3px 0 0;
    transform: rotate(7deg);
    transform-origin: bottom
  }

  .wick::after {
    content: "";
    position: absolute;
    top: -3px;
    left: -1px;
    width: 8px;
    height: 10px;
    border-radius: 50%;
    background: var(--flame-out);
    opacity: 0
  }

  .wick.ember::after {
    box-shadow: 0 0 10px 4px var(--flame-out);
    animation: ember 1.6s ease-out forwards
  }

  @keyframes ember {
    from {
      opacity: 1
    }

    to {
      opacity: 0
    }
  }

  .candle::before {
    content: "";
    position: absolute;
    z-index: 0;
    left: -16px;
    right: -16px;
    bottom: -9px;
    height: 22px;
    border-radius: 50%;
    background: #0f0818
  }

  .shadow {
    position: absolute;
    z-index: 0;
    left: 0;
    bottom: -3px;
    width: 120px;
    height: 300px;
    background: var(--shadow);
    border-radius: 50% 50% 0 0/5% 5% 0 0;
    transform-origin: 50% 100%;
    transform: skewX(42deg) scaleY(.5);
    -webkit-mask-image: linear-gradient(to top, #000 0, rgba(0, 0, 0, .55) 45%, rgba(0, 0, 0, .08) 100%);
    mask-image: linear-gradient(to top, #000 0, rgba(0, 0, 0, .55) 45%, rgba(0, 0, 0, .08) 100%);
    filter: blur(1.5px);
    animation: shadowflick 1.1s ease-in-out .7s infinite
  }

  @keyframes shadowflick {
    50% {
      transform: skewX(44.5deg) scaleY(.53)
    }
  }

  .shadow.out {
    animation: none;
    opacity: .25;
    transition: opacity .6s
  }

  body {
    overflow-x: clip
  }

  .glow {
    position: absolute;
    z-index: 0;
    left: 50%;
    bottom: calc(100% + 110px);
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 190, 80, .55) 0, rgba(255, 150, 40, .18) 40%, transparent 68%);
    transform: translate(-50%, 50%);
    animation: glow 1.3s ease-in-out .7s infinite alternate backwards
  }

  @keyframes glow {
    from {
      scale: .92;
      opacity: .8
    }

    to {
      scale: 1.06;
      opacity: 1
    }
  }

  .glow.out {
    opacity: 0;
    animation: none;
    transition: opacity .3s
  }

  .flame {
    position: absolute;
    z-index: 1;
    left: calc(50% - 62px);
    bottom: calc(100% + 20px);
    width: 125px;
    height: 207px;
    transform-origin: 50% 100%;
    rotate: calc(var(--lean, 0) * 1deg);
    transition: rotate .08s linear;
    animation: ignite .8s .7s cubic-bezier(.2, 1.6, .4, 1) backwards, flicker 1.1s ease-in-out .7s infinite
  }

  @keyframes ignite {
    from {
      scale: 0;
      opacity: 0
    }
  }

  .flame i {
    position: absolute;
    left: 50%;
    display: block;
    border-radius: 0 50% 50% 50%;
    transform: scale(1.4, 1.95) rotate(45deg)
  }

  .flame .outer {
    width: 88px;
    height: 88px;
    margin-left: -44px;
    bottom: 42px;
    background: var(--flame-out)
  }

  .flame .mid {
    width: 66px;
    height: 66px;
    margin-left: -33px;
    bottom: 37px;
    background: #FFB000
  }

  .flame .inner {
    width: 44px;
    height: 44px;
    margin-left: -22px;
    bottom: 32px;
    background: var(--flame-in)
  }

  .flame .core {
    width: 22px;
    height: 22px;
    margin-left: -11px;
    bottom: 28px;
    background: #FFF7CC
  }

  @keyframes flicker {

    0%,
    100% {
      transform: scale(1, 1) rotate(-1deg)
    }

    25% {
      transform: scale(.97, 1.05) rotate(1.5deg)
    }

    50% {
      transform: scale(1.03, .96) rotate(-1.5deg)
    }

    75% {
      transform: scale(.98, 1.03) rotate(1deg)
    }
  }

  .flame.out {
    animation: none;
    opacity: 0;
    scale: .2 .05;
    transition: scale .15s ease-in, opacity .12s
  }

  .smoke {
    position: absolute;
    z-index: 1;
    left: 50%;
    bottom: calc(100% + 24px);
    width: 0;
    height: 0
  }

  .smoke i {
    position: absolute;
    left: -12px;
    bottom: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .6);
    filter: blur(4px);
    opacity: 0
  }

  .smoke.go i {
    animation: smoke 2s ease-out forwards
  }

  .smoke i:nth-child(1) {
    --x: -26px
  }

  .smoke i:nth-child(2) {
    --x: 20px;
    animation-delay: .25s
  }

  .smoke i:nth-child(3) {
    --x: -8px;
    animation-delay: .5s
  }

  @keyframes smoke {
    0% {
      opacity: .8;
      transform: translate(0, 0) scale(.5)
    }

    100% {
      opacity: 0;
      transform: translate(var(--x), -190px) scale(2.6)
    }
  }

  #blow.shake {
    animation: shake .4s
  }

  @keyframes shake {
    20% {
      transform: translateX(-6px)
    }

    40% {
      transform: translateX(6px)
    }

    60% {
      transform: translateX(-4px)
    }

    80% {
      transform: translateX(4px)
    }
  }

  /* ---------- final screen ---------- */
  #final {
    justify-content: flex-start;
    gap: 24px
  }

  .note {
    background: var(--wax);
    color: #000;
    border: 4px solid var(--outline);
    border-radius: 18px;
    box-shadow: 8px 8px 0 var(--shadow);
    padding: 22px 24px;
    max-width: 520px;
    font-size: 1.2rem;
    line-height: 1.5;
    text-align: left
  }

  .note p {
    margin: 0 0 .8em
  }

  .note p:last-child {
    margin: 0
  }

  .photos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    max-width: 640px;
    width: 100%;
    padding-top: 8px;
    justify-items: center
  }

  .polaroid {
    margin: 0;
    background: #fff;
    color: #000;
    border: 4px solid var(--outline);
    padding: 10px 10px 8px;
    width: 160px;
    transform: rotate(var(--r, 0deg));
    box-shadow: 5px 5px 0 var(--shadow)
  }

  .polaroid img,
  .polaroid .ph {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    display: block;
    border: 3px solid var(--outline)
  }

  .polaroid .ph {
    background: var(--bg);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .9rem;
    padding: 8px
  }

  .polaroid figcaption {
    margin-top: 8px;
    font-size: .95rem
  }

  @media (prefers-reduced-motion:reduce) {
    .flame {
      animation: none
    }

    .screen.active,
    .count.pop {
      animation: none
    }
  }

  /* ---------- ambient + final animations ---------- */
  .screen {
    position: relative;
    z-index: 2
  }

  .sparkles,
  .balloons {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1
  }

  .spark {
    position: absolute;
    bottom: -20px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: #FFE9A8;
    opacity: 0;
    animation: floatup var(--d) linear var(--dl) infinite
  }

  @keyframes floatup {
    0% {
      opacity: 0;
      transform: translate(0, 0)
    }

    15% {
      opacity: .8
    }

    100% {
      opacity: 0;
      transform: translate(var(--dx), -105vh)
    }
  }

  #start .start-box {
    animation: bob 3s ease-in-out infinite
  }

  #start .btn {
    animation: pulse 1.6s ease-in-out infinite
  }

  .btn:active {
    animation: none
  }

  @keyframes bob {
    50% {
      transform: translateY(-10px)
    }
  }

  @keyframes pulse {
    50% {
      transform: scale(1.07)
    }
  }

  .mute {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    z-index: 20;
    display: none;
    width: 48px;
    height: 48px;
    font-size: 1.3rem;
    background: var(--flame-in);
    border: 4px solid var(--outline);
    border-radius: 50%;
    box-shadow: 3px 3px 0 var(--outline);
    cursor: pointer
  }

  .mute.show {
    display: block
  }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10
  }

  #finalTitle span {
    display: inline-block;
    animation: letter .6s calc(var(--i) * .05s) cubic-bezier(.2, 1.6, .4, 1) both
  }

  @keyframes letter {
    from {
      opacity: 0;
      transform: translateY(-40px) rotate(-12deg)
    }
  }

  .note {
    animation: popin .7s .3s cubic-bezier(.2, 1.5, .4, 1) both
  }

  @keyframes popin {
    from {
      opacity: 0;
      scale: .6
    }
  }

  .polaroid {
    animation: fly .8s calc(.7s + var(--i, 0) * .25s) cubic-bezier(.2, 1.2, .4, 1) both;
    transition: transform .2s
  }

  .polaroid:hover {
    transform: rotate(0deg) scale(1.06)
  }

  @keyframes fly {
    from {
      opacity: 0;
      transform: translateY(90px) rotate(calc(var(--r) * 4)) scale(.6)
    }
  }

  .balloon {
    position: absolute;
    bottom: -100px;
    left: var(--x);
    width: 54px;
    height: 66px;
    background: var(--c);
    border: 4px solid var(--outline);
    border-radius: 50% 50% 50% 50%/46% 46% 54% 54%;
    animation: balloon var(--d) ease-in-out var(--dl) infinite
  }

  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 2px;
    height: 60px;
    background: var(--outline)
  }

  @keyframes balloon {
    0% {
      transform: translate(0, 0) rotate(-4deg)
    }

    50% {
      transform: translate(18px, -60vh) rotate(5deg)
    }

    100% {
      transform: translate(-6px, -120vh) rotate(-4deg)
    }
  }

  @media (prefers-reduced-motion:reduce) {

    .balloon,
    .spark,
    .candle,
    .glow,
    #start .start-box,
    #start .btn {
      animation: none
    }
  }

  /* ================= Romantic theme ================= */
  :root {
    --sky: linear-gradient(180deg, #120a24 0%, #2b1445 55%, #5a2350 100%);
    --accent: #ff5c93;
    --gold: #ffd27a;
    --paper: #fff4ea;
    --ink: #4a2336;
    --glow: 255, 170, 110;
    --shadow: #1b0f26;
    --script: "Great Vibes", "Brush Script MT", cursive;
    --serif: "Lora", Georgia, serif
  }

  html,
  body {
    background: none
  }

  body {
    background: var(--sky);
    background-attachment: fixed;
    min-height: 100svh
  }

  h1 {
    font-family: var(--script);
    font-weight: 400
  }

  #start h1 {
    font-size: clamp(1.15rem, 7.5vw, 3rem);
    white-space: nowrap;
    color: #ffe9c7;
    text-shadow: 0 0 22px rgba(var(--glow), .6)
  }

  .prompt {
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 3.8rem);
    color: #ffe9c7;
    text-shadow: 0 0 18px rgba(var(--glow), .7)
  }

  .count {
    color: var(--gold);
    text-shadow: 0 0 24px rgba(var(--glow), .8)
  }

  .hint {
    color: #f3d9e4
  }

  .btn {
    background: linear-gradient(135deg, #ff8db5, #ff4f87);
    color: #fff;
    border: 3px solid rgba(255, 255, 255, .35);
    border-radius: 999px;
    box-shadow: 0 8px 26px rgba(255, 79, 135, .5);
    font-family: var(--script);
    font-size: 2rem;
    font-weight: 400;
    padding: .15em 1.6em
  }

  .btn:active {
    transform: scale(.96);
    box-shadow: 0 4px 14px rgba(255, 79, 135, .5)
  }

  .btn.ghost {
    background: transparent;
    border: 2px solid var(--gold);
    color: var(--gold);
    box-shadow: none;
    font-size: 1.5rem;
    padding: .1em 1.2em;
    margin-top: .8rem
  }

  .mute {
    background: rgba(255, 255, 255, .15);
    border: 2px solid var(--gold);
    box-shadow: 0 0 14px rgba(var(--glow), .5);
    backdrop-filter: blur(6px)
  }

  .body {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .07), 0 0 46px rgba(var(--glow), .2)
  }

  .scene::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -40px;
    width: 560px;
    height: 150px;
    transform: translateX(-50%);
    z-index: 0;
    background: radial-gradient(ellipse, rgba(var(--glow), .42), transparent 68%)
  }

  /* breath meter */
  .meter {
    width: min(240px, 70vw);
    height: 12px;
    margin-top: 1.1rem;
    border-radius: 99px;
    background: rgba(255, 255, 255, .14);
    overflow: hidden;
    opacity: 0;
    transition: opacity .4s
  }

  .meter.on {
    opacity: 1
  }

  .meter i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    transition: width .08s linear
  }

  /* night bokeh background */
  #bokeh {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden
  }

  #bokeh i {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: var(--o);
    background: radial-gradient(circle, rgba(var(--c), .9) 0, rgba(var(--c), .35) 55%, transparent 72%);
    animation: bk 5s ease-in-out var(--dl) infinite alternate
  }

  @keyframes bk {
    to {
      opacity: calc(var(--o) * .35);
      transform: scale(1.15)
    }
  }

  #bokeh b {
    position: absolute;
    width: var(--z);
    height: var(--z);
    border-radius: 50%;
    background: #fff;
    animation: tw 3s ease-in-out var(--dl) infinite
  }

  @keyframes tw {
    50% {
      opacity: .15
    }
  }

  #bokeh u {
    position: absolute;
    top: 6%;
    right: 8%;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    text-decoration: none;
    background: radial-gradient(circle at 35% 35%, #fffbe8, #f3e3b5 60%, #d9c58f);
    box-shadow: 0 0 40px 12px rgba(255, 240, 200, .35), 0 0 120px 40px rgba(255, 220, 160, .16)
  }

  #bgphoto {
    position: fixed;
    inset: -20px;
    z-index: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s
  }

  body.final #bgphoto {
    opacity: 1
  }

  /* final scene */
  #final {
    justify-content: flex-start;
    padding-top: 120px;
    gap: 10px
  }

  .lights {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 90px;
    pointer-events: none;
    z-index: 3
  }

  .lights svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%
  }

  .lights i {
    position: absolute;
    width: 10px;
    height: 15px;
    margin-left: -5px;
    border-radius: 50% 50% 50% 50%/60% 60% 40% 40%;
    background: var(--c);
    box-shadow: 0 0 12px 4px var(--c);
    animation: twinkle 2.4s ease-in-out var(--dl) infinite
  }

  @keyframes twinkle {
    50% {
      opacity: .35;
      transform: scale(.85)
    }
  }

  #finalTitle {

    box-shadow: 0 3px 6px rgba(60, 20, 50, .25), 0 34px 70px -12px rgba(15, 4, 35, .65), 0 0 0 8px rgba(255, 255, 255, .07), 0 0 70px rgba(var(--glow), .22)

  /* ===== candle burns from the very first moment ===== */
  .flame {

  }

    animation: glow 1.3s ease-in-out infinite alternate
  }

  .shadow {
    animation: shadowflick 1.1s ease-in-out infinite
  }

  /* ===== scene transitions ===== */
  .screen.active {
    animation: none
  }

  .screen:not(.shown)>* {
    opacity: 0;
    translate: 0 26px;
    filter: blur(8px)
  }

  .screen>* {
    transition: opacity .9s cubic-bezier(.2, .8, .2, 1), translate .9s cubic-bezier(.2, .8, .2, 1), filter .9s ease;
    transition-delay: calc(var(--s, 0) * .1s + .15s)
  }

  .screen>*:nth-child(1) {
    --s: 0
  }

  .screen>*:nth-child(2) {
    --s: 1
  }

  .screen>*:nth-child(3) {
    --s: 2
  }

  .screen>*:nth-child(4) {
    --s: 3
  }

  .screen>*:nth-child(5) {
    --s: 4
  }

  .screen>*:nth-child(6) {
    --s: 5
  }

  .screen>*:nth-child(7) {
    --s: 6
  }

  .screen>*:nth-child(8) {
    --s: 7
  }

  .screen>*:nth-child(9) {
    --s: 8
  }

  .screen>.meter {
    transition: opacity .4s 0s
  }

  .screen.leaving {
    display: flex;

    z-index: 3;

  .candle {

  }

    height: 5px;
    left: var(--x, 50%);
    top: var(--y, 50%);
    border-radius: 50%;
    background: #e8ffb0;
    box-shadow: 0 0 6px 2px rgba(232, 255, 176, .9), 0 0 16px 6px rgba(232, 255, 176, .35);
    animation: firefly-drift var(--fd, 14s) ease-in-out infinite, firefly-glow var(--fg, 2.6s) ease-in-out infinite;
    animation-delay: var(--dl, 0s), var(--dl2, 0s)
  }

  @keyframes firefly-drift {

    0%,
    100% {
      transform: translate(0, 0)
    }

    25% {
      transform: translate(var(--dx1, 40px), var(--dy1, -30px))
    }

    50% {
      transform: translate(var(--dx2, -25px), var(--dy2, -60px))
    }

    75% {
      transform: translate(var(--dx3, 30px), var(--dy3, -18px))
    }
  }

  @keyframes firefly-glow {

    0%,
    100% {
      opacity: .1
    }

    50% {
      opacity: 1
    }
  }

  /* ===== start-screen butterflies ===== */

  .stage {
    position: relative;
    width: min(90vw, 460px);
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center
  }

  .start-box {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    padding: 34px 28px;
    text-align: center;
    background: rgba(40, 16, 36, .45);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 22px;
    backdrop-filter: blur(6px);
    box-shadow: 0 14px 48px rgba(0, 0, 0, .35)
  }

  .start-box h1 {
    margin: 0
  }

  /* Simple, single-level 3D (one perspective per butterfly) instead of a deep
     nested transform chain — more reliable across browsers inside a flex layout. */
  .scene3d-mini {
    position: absolute;
    inset: -30px;
    z-index: 2;
    pointer-events: none
  }

  @keyframes bfly-fly {

    0%,
    100% {
      transform: translate3d(var(--x0, 0px), var(--y0, 0px), 0) rotate(0deg)
    }

    25% {
      transform: translate3d(var(--x1, 30px), var(--y1, -25px), 0) rotate(8deg)
    }

    50% {
      transform: translate3d(var(--x2, -10px), var(--y2, -50px), 0) rotate(-7deg)
    }

    75% {
      transform: translate3d(var(--x3, -35px), var(--y3, -15px), 0) rotate(9deg)
    }
  }

  @keyframes bfly-flap {

    0%,
    100% {
      transform: rotateY(0deg) scaleY(1)
    }

    50% {
      transform: rotateY(var(--fold-angle)) scaleY(.88)
    }
  }

  .butterfly {
    position: absolute;
    width: var(--sz, 32px);
    height: var(--sz, 32px);
    perspective: 140px;
    animation: bfly-fly var(--fd, 7s) ease-in-out infinite;
    will-change: transform, translate, rotate;
    animation-delay: var(--dl, 0s);
    translate: var(--interaction-x, 0px) var(--interaction-y, 0px);
    rotate: var(--interaction-tilt, 0deg)
  }

  .butterfly .wing,
  .candle-butterfly .wing {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    animation: bfly-flap var(--fl, .42s) cubic-bezier(.45, 0, .55, 1) infinite
  }

  .butterfly .wing.left,
  .candle-butterfly .wing.left {
    left: 0;
    transform-origin: 100% 50%;
    --fold-angle: -68deg
  }

  .butterfly .wing.right,
  .candle-butterfly .wing.right {
    left: 50%;
    transform-origin: 0 50%;
    --fold-angle: 68deg
  }

  .butterfly .wing svg,
  .candle-butterfly .wing svg {
    display: block;
    width: 100%;
    height: 100%
  }

  .butterfly .wing.right svg,
  .candle-butterfly .wing.right svg {
    transform: scaleX(-1)
  }

  .butterfly .wing use,
  .candle-butterfly .wing use {
    stroke: #fff;
    stroke-width: .6;
    filter: drop-shadow(0 0 5px currentColor) saturate(1.4) brightness(1.05)
  }

  .wing.variant-0 use {
    fill: url(#wing-grad-0);
    color: #ff2d78
  }

  .wing.variant-1 use {
    fill: url(#wing-grad-1);
    color: #00b4ff
  }

  .wing.variant-2 use {
    fill: url(#wing-grad-2);
    color: #c026ff
  }

  .wing.variant-3 use {
    fill: url(#wing-grad-3);
    color: #17d96b
  }

  .wing.variant-4 use {
    fill: url(#wing-grad-4);
    color: #ffb400
  }

  .wing.variant-5 use {
    fill: url(#wing-grad-5);
    color: #ff4b2b
  }

  .wing.variant-6 use {
    fill: url(#wing-grad-6);
    color: #00e0c6
  }

  /* ===== 7 enhancements ===== */

  /* 1. Butterfly-to-candle: lands beside the flame, flies up when it's blown out */
  .candle-butterfly {
    position: absolute;
    left: calc(100% - 6px);
    bottom: 128px;
    width: 34px;
    height: 34px;
    perspective: 140px;
    opacity: 0;
    transform: translate(60px, -40px) scale(.6);
    transition: opacity 1.2s ease, transform 1.8s cubic-bezier(.2, .8, .2, 1)
  }

  .candle-butterfly.landed {
    opacity: 1;
    transform: translate(0, 0) scale(1)
  }

  .candle-butterfly.away {
    opacity: 0;
    transition: opacity 1.4s ease .3s, transform 1.6s ease-in;
    transform: translate(-40px, -260px) scale(.4) rotate(-12deg)
  }

  .candle-butterfly .wing {
    --fl: .5s
  }

  .candle-butterfly.landed .wing {
    --fl: .32s
  }

  /* 4/5. section label above the constellation */
  .section-label {
    font-family: var(--script);
    font-weight: 400;
    font-size: 1.6rem;
    color: var(--gold);
    margin: .6rem 0 0;
    text-shadow: 0 0 14px rgba(var(--glow), .5)
  }

  /* 5. Personal constellation */
  .constellation {
    position: relative;
    width: min(92vw, 560px);
    height: 220px;
    margin: 4px auto 0
  }

  .star-point {
    position: absolute;
    width: 24px;
    height: 24px;
    margin: -12px;
    border: none;
    padding: 0;
    background: none;
    cursor: pointer
  }

  .star-point::before {
    content: "💛";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 17px;
    line-height: 1;
    filter: drop-shadow(0 0 3px rgba(255, 242, 160, .8));
    transform-origin: center;
    animation: heart-star-sparkle 1.7s ease-in-out infinite;
    animation-delay: var(--dl, 0s)
  }

  .star-point::after {
    content: "✦";
    position: absolute;
    top: -3px;
    right: -3px;
    color: #fff9dd;
    font-size: 9px;
    line-height: 1;
    text-shadow: 0 0 5px #fff3a0;
    animation: star-glint 1.2s ease-in-out infinite;
    animation-delay: var(--dl, 0s)
  }

  .star-point:hover::before,
  .star-point:focus-visible::before {
    filter: drop-shadow(0 0 7px rgba(255, 240, 130, 1))
  }

  @keyframes heart-star-sparkle {

    0%,
    100% {
      opacity: .82;
      transform: scale(.88) rotate(-5deg);
      filter: drop-shadow(0 0 2px rgba(255, 242, 160, .65))
    }

    50% {
      opacity: 1;
      transform: scale(1.16) rotate(5deg);
      filter: drop-shadow(0 0 8px rgba(255, 242, 120, 1))
    }
  }

  @keyframes star-glint {

    0%,
    100% {
      opacity: .2;
      transform: scale(.55) rotate(0deg)
    }

    50% {
      opacity: 1;
      transform: scale(1.2) rotate(45deg)
    }
  }

  .love-scene {
    position: relative;
    width: 100%;
    height: clamp(150px, 22vh, 210px);
    overflow: visible
  }

  #love-heart {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none
  }

  .love-scene .constellation {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0
  }

  .star-popup {
    position: absolute;
    left: 50%;
    top: 50%;
    bottom: auto;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: max-content;
    max-width: min(86vw, 360px);
    padding: 14px 18px;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink);
    background: linear-gradient(160deg, var(--paper), #ffe9dc);
    border-radius: 14px;
    border: 1px solid rgba(255, 210, 122, .8);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .4);
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s, transform .3s
  }

  .star-popup.show {
    opacity: 1;
    transform: translate(-50%, calc(-50% - 6px))
  }

  /* 6. Secret letter envelope — redesigned: blush paper, crimson ribbon + wax seal */
  .envelope {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    cursor: pointer;
    filter: drop-shadow(0 14px 22px rgba(49, 8, 28, .26));
    transition: transform .35s ease, filter .35s ease
  }

  .envelope:not(.open):hover {
    transform: translateY(-4px);
    filter: drop-shadow(0 18px 26px rgba(49, 8, 28, .34))
  }

  .env-body {
    position: relative;
    width: 230px;
    height: 150px;
    isolation: isolate
  }

  .env-back {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border: 1px solid rgba(198, 151, 87, .8);
    border-radius: 12px;
    background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .13) 0 1px, transparent 1px 7px),
      linear-gradient(145deg, #fffaf2 0%, #f9dce2 52%, #eeb4c5 100%);
    box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .38), inset 0 0 0 5px rgba(198, 151, 87, .2)
  }

  .env-back::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255, 255, 255, .55);
    border-radius: 7px
  }

  .env-ribbon {
    position: absolute;
    left: 0;
    top: 58%;
    width: 100%;
    height: 16px;
    z-index: 1;
    background: linear-gradient(180deg, #f6c8d2, #c74368 42%, #9f2347 58%, #df7890);
    box-shadow: 0 2px 5px rgba(92, 17, 43, .22), inset 0 1px rgba(255, 255, 255, .45)
  }

  .env-body::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    clip-path: polygon(0 31%, 50% 76%, 100% 31%, 100% 100%, 0 100%);
    background: linear-gradient(145deg, rgba(255, 250, 242, .98), rgba(246, 219, 222, .98) 54%, rgba(226, 168, 184, .98));
    box-shadow: inset 0 0 0 1px rgba(198, 151, 87, .55)
  }

  .env-letter {
    position: absolute;
    left: 12%;
    right: 12%;
    top: 5%;
    height: 76%;
    border: 1px solid rgba(198, 151, 87, .42);
    border-radius: 5px 5px 2px 2px;
    background: linear-gradient(160deg, #fffefa, #fff5e8);
    box-shadow: 0 2px 8px rgba(78, 29, 44, .18);
    transition: transform .65s cubic-bezier(.2, .9, .3, 1.1);
    transform: translateY(0);
    z-index: 1
  }

  .env-letter::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(198, 151, 87, .28);
    border-radius: 2px
  }

  .env-flap {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 68%;
    clip-path: polygon(0 0, 100% 0, 50% 78%);
    background: linear-gradient(145deg, #fff0e8 0%, #f4bdcc 54%, #da829d 100%);
    border-radius: 12px 12px 0 0;
    transform-origin: 50% 0%;
    transition: transform .65s cubic-bezier(.3, .2, .2, 1);
    z-index: 3;
    filter: drop-shadow(0 2px 2px rgba(100, 30, 51, .18))
  }

  .env-seal {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 54px;
    height: 54px;
    margin-left: -27px;
    border-radius: 50%;
    z-index: 4;
    border: 1px solid rgba(255, 220, 171, .9);
    background: radial-gradient(circle at 34% 26%, #ffb1a2 0%, #d94764 35%, #9d183f 76%, #6e102e 100%);
    box-shadow: 0 5px 9px rgba(70, 13, 35, .38), inset 0 0 0 3px rgba(255, 223, 174, .42),
      inset 0 0 0 5px rgba(120, 12, 43, .28), inset 0 -5px 9px rgba(72, 7, 28, .34);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff8e9;
    font-family: var(--script);
    font-size: 1.55rem;
    text-shadow: 0 1px 2px rgba(70, 8, 31, .6), 0 0 8px rgba(255, 255, 255, .48);
    transition: opacity .35s ease, transform .35s ease;
    animation: seal-pulse 2.6s ease-in-out infinite
  }

  .env-seal::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255, 226, 190, .58);
    border-radius: 50%
  }

  @keyframes seal-pulse {

    0%,
    100% {
      transform: scale(1)
    }

    50% {
      transform: scale(1.06)
    }
  }

  .env-hint {
    font-family: var(--serif);
    font-style: italic;
    color: #fff1df;
    margin: 0;
    letter-spacing: .04em;
    text-shadow: 0 1px 8px rgba(74, 20, 45, .4)
  }

  .env-hint::before,
  .env-hint::after {
    content: "✦";
    display: inline-block;
    margin: 0 .7em;
    color: #ffdf9a;
    font-size: .72em;
    vertical-align: .12em
  }

  .envelope.open .env-flap {
    transform: rotateX(-165deg)
  }

  .envelope.open .env-seal {
    opacity: 0;
    transform: scale(.4) translateY(-10px);
    animation: none
  }

  .envelope.open .env-letter {
    transform: translateY(-58%)
  }

  .envelope.open {
    cursor: default
  }

  /* 7+. Creative extra: hearts drifting upward on the final screen */
  .heart-rain {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease
  }

  body[data-scene="final"] .heart-rain {
    opacity: 1
  }

  .rising-heart {
    position: absolute;
    left: var(--x, 50%);
    bottom: -40px;
    font-size: var(--sz, 1.4rem);
    color: var(--c, #ff6f91);
    opacity: 0;
    filter: drop-shadow(0 0 6px rgba(255, 120, 160, .6));
    animation: heart-rise var(--rd, 12s) linear var(--rdl, 0s) infinite
  }

  @keyframes heart-rise {
    0% {
      opacity: 0;
      transform: translateY(0) translateX(0) rotate(0deg)
    }

    10% {
      opacity: .9
    }

    90% {
      opacity: .7
    }

    100% {
      opacity: 0;
      transform: translateY(-115vh) translateX(var(--dx, 20px)) rotate(18deg)
    }
  }

  /* 5. Memory gallery lightbox */
  .photos figure {
    cursor: pointer
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 5, 20, .88);
    backdrop-filter: blur(4px);
    padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0)
  }

  .lightbox[hidden] {
    display: none
  }

  .lb-figure {
    margin: 0;
    max-width: min(92vw, 520px);
    text-align: center
  }

  .lb-img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6)
  }

  .lb-caption {
    color: #fdeef3;
    font-family: var(--serif);
    font-style: italic;
    margin-top: 12px
  }

  .lb-close {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .15);
    border: 2px solid var(--gold);
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer
  }

  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .15);
    border: 2px solid var(--gold);
    color: #fff;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer
  }

  .lb-prev {
    left: 10px
  }

  .lb-next {
    right: 10px
  }

  /* 7. Final surprise */
  .finale {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-top: 1rem
  }

  .finale .btn {
    font-size: 1.1rem;
    padding: .5em 1.1em
  }

  #final {
    width: 100%;
    min-height: 100svh;
    padding: clamp(34px, 6vh, 72px) 20px 64px;
    gap: clamp(26px, 4vw, 44px)
  }

  .birthday-header {
    width: min(100%, 850px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px
  }

  .birthday-heading {
    position: relative;
    z-index: 4;
    width: fit-content;
    max-width: 100%;
    min-width: 0;
    gap: clamp(2px, .5vw, 8px);
    padding: 8px clamp(14px, 3vw, 24px) 10px;
    border: 1px solid rgba(255, 235, 197, .45);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(58, 15, 43, .76), rgba(92, 24, 57, .7));
    box-shadow: 0 5px 18px rgba(31, 8, 28, .32), inset 0 1px rgba(255, 255, 255, .2);
    backdrop-filter: blur(8px);
    overflow: visible;
    margin-top: 32px
  }

  .birthday-heading::before,
  .birthday-heading::after {
    position: absolute;
    top: -8px;
    z-index: 1;
    font-family: var(--font);
    font-size: clamp(12px, 3.5vw, 18px);
    line-height: 1;
    pointer-events: none
  }

  .birthday-heading::before {
    content: "✨";
    left: 10px
  }

  .birthday-heading::after {
    content: "💖";
    right: 10px
  }

  #finalTitle,
  #finalName {
    flex: 0 0 auto;
    width: max-content;
    max-width: none;
    overflow: visible
  }

  #finalTitle {
    font-size: clamp(1rem, 5.4vw, 3.3rem)
  }

  #finalName {
    font-size: clamp(1.4rem, 7.5vw, 4.5rem);
    line-height: 1.5;
    padding: .28em .16em .18em
  }

  #finalTitle,
  #finalName {
    font-family: var(--script);
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0
  }

  .sub {
    max-width: 620px;
    line-height: 1.6
  }

  .final-memories,
  .final-letter {
    width: min(100%, 820px);
    padding: clamp(18px, 4vw, 34px);
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .035));
    box-shadow: 0 18px 48px rgba(8, 3, 20, .24), inset 0 1px rgba(255, 255, 255, .08);
    backdrop-filter: blur(8px)
  }

  .final-memories {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px
  }

  .gallery-label {
    margin: 0
  }

  .photos {
    width: 100%;
    max-width: 720px;
    padding: 8px 0 10px;
    gap: clamp(18px, 3vw, 30px) 24px
  }

  .constellation {
    width: min(100%, 560px);
    margin: 0 auto
  }

  .final-letter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px
  }

  .envelope {
    margin: 0
  }

  .heart {
    line-height: 1
  }

  .note {
    width: 100%;
    margin: 0
  }

  .sign {
    margin: 0
  }

  .finale {
    margin: 8px 0 0
  }

  @media (max-width:480px) {
    #final {
      padding: 32px 14px 44px;
      gap: 24px
    }

    .final-memories,
    .final-letter {
      padding: 18px 14px;
      border-radius: 22px
    }

    .photos {
      gap: 20px 12px
    }

    .polaroid {
      width: min(150px, 40vw)
    }

    .constellation {
      height: 180px
    }

    .finale {
      gap: 10px
    }

    .env-body {
      width: 170px;
      height: 116px
    }
  }

  /* Keep the final birthday screen together without clipping on smaller viewports. */
  #final {
    grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
    grid-template-areas: "header header" "memories letter" "footer footer";
    align-content: space-between;
    align-items: stretch;
    justify-items: center;
    gap: clamp(10px, 2vh, 20px);
    padding: clamp(14px, 2vh, 24px) clamp(14px, 3vw, 40px);
  }

  #final.active {
    display: grid
  }

  .birthday-header {
    grid-area: header
  }

  .birthday-heading {
    margin-top: 0
  }

  .final-memories {
    grid-area: memories
  }

  .final-letter {
    grid-area: letter
  }

  .final-footer {
    grid-area: footer;
    justify-self: center;
    margin: 0;
    padding: 7px 18px 8px;
    border: 1px solid rgba(255, 235, 197, .45);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(58, 15, 43, .76), rgba(92, 24, 57, .7));
    box-shadow: 0 5px 18px rgba(31, 8, 28, .32), inset 0 1px rgba(255, 255, 255, .2);
    color: #ffe7b0;
    font-family: var(--script);
    font-size: 1.28rem;
    line-height: 1;
    letter-spacing: .025em;
    text-align: center;
    text-shadow: 0 1px 2px rgba(30, 5, 20, .75), 0 0 10px rgba(255, 220, 165, .35)
  }

  .final-memories,
  .final-letter {
    width: 100%;
    min-width: 0;
    max-width: none;
    padding: clamp(12px, 1.8vw, 22px);
    gap: 10px
  }

  .photos {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    padding: 0
  }

  .polaroid {
    width: 100%;
    min-width: 0;
    padding: 7px 7px 5px
  }

  .polaroid figcaption {
    font-size: clamp(.65rem, 1vw, .85rem);
    line-height: 1.15
  }

  .constellation {
    width: 100%;
    height: clamp(90px, 16vh, 140px)
  }

  .envelope {
    gap: 5px
  }

  .env-body {
    width: 160px;
    height: 106px
  }

  .note {
    min-height: 0;
    padding: clamp(14px, 2vw, 24px);
    font-size: clamp(1rem, 1.25vw, 1.15rem);
    line-height: 1.5
  }

  .note p {
    margin-bottom: .55em
  }

  .note p:first-child {
    font-size: clamp(1.4rem, 2vw, 2rem);
    line-height: 1.2;
    padding-bottom: .2em;
    margin-bottom: .5em
  }

  .finale {
    margin: 4px 0 0;
    gap: 8px
  }

  @media (max-width:700px) {
    #final {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "header" "memories" "letter" "footer";
      align-content: space-between;
      gap: clamp(8px, 1.5vh, 14px);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 12px calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .birthday-header {
      gap: 4px
    }

    .birthday-heading {
      gap: 2px;
      padding: 6px clamp(8px, 2.4vw, 16px) 8px
    }

    .sub {
      font-size: clamp(.78rem, 3vw, 1rem);
      line-height: 1.25;
      margin: 0
    }

    .final-memories,
    .final-letter {
      padding: 10px 12px;
      border-radius: 20px;
      gap: 6px
    }

    .gallery-label,
    .section-label {
      font-size: 1.2rem
    }

    .photos {
      gap: 6px
    }

    .polaroid {
      padding: 4px 4px 3px
    }

    .polaroid figcaption {
      margin-top: 4px;
      font-size: .68rem
    }

    .constellation {
      height: clamp(72px, 10vh, 90px)
    }

    .env-body {
      width: 145px;
      height: 96px
    }

    .env-hint {
      font-size: .85rem
    }

    .heart {
      font-size: 1.35rem
    }

    .note {
      padding: 12px;
      font-size: .92rem;
      line-height: 1.35
    }

    .note p:first-child {
      font-size: 1.35rem
    }

    .finale .btn {
      font-size: 1rem
    }
  }

  #start {
    overflow: clip;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }

  #start .stage {
    width: min(90vw, 460px);
    height: min(420px, calc(100svh - 48px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
  }

  #start .start-box {
    max-width: 100%;
    padding: clamp(20px, 5vw, 34px) clamp(18px, 5vw, 28px)
  }

  #start h1 {
    width: max-content;
    max-width: none;
    font-size: clamp(1rem, 5.6vw, 2.4rem);
    line-height: 1.15;
    white-space: nowrap
  }

  #blow {
    justify-content: flex-start;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }

  #blow .prompt {
    max-width: 100%;
    font-size: clamp(2.5rem, 12vw, 4.2rem);
    line-height: 1.1
  }

  @media (max-width:700px) {
    .full-bg {
      background: radial-gradient(ellipse at 50% 15%, #ffc0d1 0%, #ff789a 36%, #e83f6d 68%, #a91f49 100%)
    }

    .full-bg-scene .cube.skybox {
      display: none
    }
  }
</style>

  <!-- Full-page background from butterfly_1.html: sky + rotating skybox cube + roaming butterflies -->

  <section class="full-bg-scene">
    <div class="cube skybox">
      <var class="scale">
        <figure class="face front"></figure>
        <figure class="face back"></figure>
        <figure class="face right"></figure>
        <figure class="face left"></figure>
        <figure class="face top"></figure>
        <figure class="face bottom"></figure>
      </var>
    </div>
    <div id="full-bg-butterflies"></div>
  </section>

  <!-- Candle-screen-only background: plain black with drifting fireflies -->
  <section class="blow-bg">
    <div id="fireflies"></div>
  </section>

  <!-- Final-screen-only: soft hearts drifting upward -->
  <section class="heart-rain" id="heartRain"></section>

  <div id="sparkles" class="sparkles"></div>
  <div id="balloons" class="balloons"></div>
  <canvas id="fx"></canvas>
  <div id="veil"></div>
  <button id="mute" class="mute" type="button" aria-label="Toggle music">🔊</button>
  <main>
    <!-- Screen 1: start -->
    <section id="start" class="screen active">
      <div class="stage">
        <div id="start-butterflies" class="scene3d-mini"></div>
        <div class="start-box">
          <h1 id="startTitle">I made something for you</h1>
          <button id="startBtn" class="btn" type="button">Start</button>
        </div>
      </div>
    </section>

    <!-- Screen 2: countdown + candle -->
    <section id="blow" class="screen">
      <p id="prompt" class="prompt">Blow the candle in:</p>
      <div id="count" class="count" aria-live="polite">3</div>
      <div class="scene" id="scene">
        <div class="candle">
          <div class="shadow"></div>
          <div class="glow" id="glow"></div>
          <div class="smoke" id="smoke"><i></i><i></i><i></i></div>
          <div class="flame" id="flame"><i class="outer"></i><i class="mid"></i><i class="inner"></i><i class="core"></i></div>
          <div class="wick" id="wick"></div>
          <div class="body">
            <div class="drip"></div><div class="drip d2"></div>
            <div class="pool"></div>
          </div>
        </div>
        <!-- Butterfly-to-candle: lands beside the flame, then flies off when it's blown out -->
        <div class="candle-butterfly" id="candleButterfly">
          <div class="wing left variant-4"><svg viewBox="0 0 50 100"><use xlink:href="#shape-butterfly-1"></use></svg></div>
          <div class="wing right variant-4"><svg viewBox="0 0 50 100"><use xlink:href="#shape-butterfly-1"></use></svg></div>
        </div>
      </div>
      <div class="meter" id="meter"><i id="meterFill"></i></div>
      <p id="hint" class="hint"></p>
    </section>

    <!-- Screen 3: wishes + photos -->
    <section id="final" class="screen">
      <div class="lights" id="lights"></div>
      <header class="birthday-header">
        <div class="birthday-heading">
          <h1 id="finalTitle"></h1>
          <h2 id="finalName"></h2>
        </div>
        <p class="sub" id="subtitle"></p>
      </header>

      <section class="final-memories" aria-label="Birthday memories">
        <h3 class="section-label gallery-label">A few favorite moments</h3>
        <div class="photos" id="photos"></div>
        <h3 class="section-label" id="constellationLabel" hidden>A few stars, just for you ✨</h3>
        <div class="love-scene">
          <canvas id="love-heart" aria-hidden="true"></canvas>
          <div class="constellation" id="constellation"></div>
          <div id="starPopup" class="star-popup" hidden></div>
        </div>
      </section>

      <section class="final-letter" aria-label="Birthday letter">
        <div class="envelope" id="envelope">
          <div class="env-body">
            <div class="env-back"></div>
            <div class="env-ribbon"></div>
            <div class="env-flap" id="envFlap"></div>
            <div class="env-seal" id="envSeal"></div>
            <div class="env-letter" id="envLetterPeek"></div>
          </div>
          <p class="env-hint" id="envHint">Tap to open the letter</p>
        </div>
        <div class="heart">♥︎</div>
        <div class="note" id="note" hidden></div>
        <p class="sign" id="sign" hidden></p>

        <div class="finale" id="finale" hidden>
          <button id="keepsakeBtn" class="btn" type="button">📥 Save keepsake card</button>
          <button id="replayBtn" class="btn" type="button">🔁 Replay</button>
        </div>
      </section>

      <p class="final-footer" id="finalFooter"></p>
    </section>
  </main>

  <!-- Memory gallery lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lbClose" class="lb-close" type="button" aria-label="Close">✕</button>
    <button id="lbPrev" class="lb-nav lb-prev" type="button" aria-label="Previous">‹</button>
    <figure class="lb-figure">
      <img id="lbImg" class="lb-img" alt="">
      <figcaption id="lbCaption" class="lb-caption"></figcaption>
    </figure>
    <button id="lbNext" class="lb-nav lb-next" type="button" aria-label="Next">›</button>
  </div>

  <!-- Off-screen canvas used only to render the downloadable keepsake card -->
  <canvas id="keepsakeCanvas" width="1000" height="1400" hidden></canvas>

  <script src="script.js" defer></script>
